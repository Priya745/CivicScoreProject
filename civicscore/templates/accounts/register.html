{% extends "base.html" %}
{% load static %}

{% block title %}Register | CivicScore{% endblock %}

{% block content %}

<style>
    /* --- AUTHENTICATION PAGE STYLING --- */
    .auth-wrapper {
        padding: 40px 0;
    }

    .auth-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-light);
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        padding: 40px;
    }

    .auth-title {
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: -0.5px;
        font-size: 1.75rem;
    }

    .form-label {
        font-weight: 600;
        color: var(--text-main);
        font-size: 0.9rem;
        margin-bottom: 6px;
    }

    .custom-input {
        border-radius: 8px;
        border: 1px solid var(--border-light);
        padding: 12px 16px;
        font-size: 0.95rem;
        background-color: #f8fafc; /* Very subtle slate bg for inputs */
        transition: all 0.2s ease;
    }

    .custom-input:focus {
        background-color: #ffffff;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        outline: none;
    }

    .auth-link {
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .auth-link:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }
</style>

<div class="container auth-wrapper">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">

            <div class="auth-card">
                <div class="text-center mb-4">
                    <h3 class="auth-title">Create Account</h3>
                    <p class="text-muted" style="font-size: 0.95rem;">Join CivicScore and start making an impact.</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control custom-input" placeholder="e.g. Jane Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control custom-input" placeholder="jane@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control custom-input" placeholder="Choose a unique username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password1" class="form-control custom-input" placeholder="Create a strong password" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="password2" class="form-control custom-input" placeholder="Repeat your password" required>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn-primary-custom" style="padding: 12px; font-size: 1rem;">
                            Register Securely
                        </button>
                    </div>

                </form>

                <div class="text-center">
                    <p class="text-muted mb-0" style="font-size: 0.95rem;">
                        Already have an account? 
                        <a href="{% url 'login' %}" class="auth-link">Log in here</a>
                    </p>
                </div>

            </div>

        </div>
    </div>
</div>

{% endblock %}
