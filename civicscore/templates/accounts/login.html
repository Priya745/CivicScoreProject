{% extends "base.html" %}

{% block title %}
Login | CivicScore
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-lg p-4">

            <h3 class="text-center mb-4">
                🔐 Login to CivicScore
            </h3>

            <form method="POST">
                {% csrf_token %}

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter password"
                           required>
                </div>

                <!-- Login Button -->
                <div class="d-grid">
                    <button type="submit"
                            class="btn btn-success">
                        Login
                    </button>
                </div>

            </form>

            <!-- Register Option -->
            <div class="text-center mt-3">
                <p>
                    Don't have an account?
                    <a href="{% url 'register' %}">
                        Register here
                    </a>
                </p>
            </div>

        </div>

    </div>
</div>

{% endblock %}
