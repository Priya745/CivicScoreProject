{% extends "base.html" %}

{% block title %}Admin Dashboard | CivicScore{% endblock %}

{% block content %}
<style>
    .admin-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
    .admin-sidebar { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; }
    .admin-sidebar .nav-link { color: #374151; font-weight: 500; border-radius: 8px; margin-bottom: 6px; }
    .admin-sidebar .nav-link.active, .admin-sidebar .nav-link:hover { background: #eef2ff; color: #4338ca; }
    .admin-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; }
    .admin-card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    @media (max-width: 991px) { .admin-layout { grid-template-columns: 1fr; } }
</style>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <h5 class="mb-3">Admin Dashboard</h5>
        <nav class="nav flex-column">
            <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a class="nav-link {% if active_tab == 'activities' %}active{% endif %}" href="{% url 'admin_activities' %}">Activities</a>
            <a class="nav-link {% if active_tab == 'users' %}active{% endif %}" href="{% url 'admin_users' %}">Users</a>
            <a class="nav-link {% if active_tab == 'ngos' %}active{% endif %}" href="{% url 'admin_ngos' %}">NGOs</a>
            <a class="nav-link {% if active_tab == 'rewards' %}active{% endif %}" href="{% url 'admin_rewards' %}">Rewards</a>
            <a class="nav-link {% if active_tab == 'redeemed_rewards' %}active{% endif %}" href="{% url 'admin_redeemed_rewards' %}">Redeemed Rewards</a>
            <a class="nav-link {% if active_tab == 'reward_notifications' %}active{% endif %}" href="{% url 'admin_reward_notifications' %}">Notifications</a>
            <a class="nav-link {% if active_tab == 'leaderboard' %}active{% endif %}" href="{% url 'admin_leaderboard' %}">Leaderboard</a>
            <a class="nav-link text-danger" href="{% url 'logout' %}">Logout</a>
        </nav>
    </aside>
    <section class="admin-panel">
        {% block admin_content %}{% endblock %}
    </section>
</div>
{% endblock %}
